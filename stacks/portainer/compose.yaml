services:
  portainer:
    container_name: portainer
    hostname: portainer
    image: portainer/portainer-ce:2.44.0
    restart: unless-stopped
    environment:
      - SSL_CERT_FILE=/certs/ca-bundle.crt
    volumes:
      - /opt/homelab/data/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homelab/ssl/certs/home-arpa/ca-bundle.crt:/certs/ca-bundle.crt:ro
    networks:
      - reverse_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.home.arpa`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000

networks:
  reverse_proxy:
    external: true
