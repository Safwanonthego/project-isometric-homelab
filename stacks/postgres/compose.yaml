
services:
  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:17.10-alpine3.24
    restart: unless-stopped
    volumes:
      - /opt/homelab/data/postgres:/var/lib/postgresql/data:rw
      - /opt/homelab/configs/postgres/init:/docker-entrypoint-initdb.d:ro
    secrets:
      - source: authentik_db_password
        target: authentik_db_password
      - source: netbox_db_password
        target: netbox_db_password
      - source: postgres_admin_password
        target: postgres_admin_password
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_admin_password
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

secrets:
  authentik_db_password:
    file: /opt/homelab/secrets/authentik_db_password
  netbox_db_password:
    file: /opt/homelab/secrets/netbox_db_password
  postgres_admin_password:
    file: /opt/homelab/secrets/postgres_admin_password




networks:
  internal:
    external: true

