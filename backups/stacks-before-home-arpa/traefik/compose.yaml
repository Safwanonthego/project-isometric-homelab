services:
  traefik:
    container_name: traefik
    image: traefik:v3.7.10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/homelab/ssl/certs:/certs:ro
      - /opt/homelab/data/traefik/dynamic:/dynamic:ro
    command:
      # EntryPoints - plain HTTP always redirects to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true

      # Dynamic directory provider - loads the files in the dir dynamicaly
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true

      # Docker provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=reverse_proxy

      # API & Dashboard - insecure disabled, only reachable via the
      # authenticated router defined in labels below
      - --api.dashboard=true
      - --api.insecure=false

      # Health check endpoint
      - --ping=true

      # Observability logs & metrics
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      # - --accesslog.filters.statuscodes=400-599

      - --metrics.prometheus=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3


    labels:
      - traefik.enable=true

      # Dashboard router, TLS + basic-auth protected
      - traefik.http.routers.dashboard.rule=Host(`traefik.imetric.arpa`) || Host(`traefik.home.arpa`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.middlewares=dashboard-auth@file

    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "10"

networks:
  reverse_proxy:
    external: true
